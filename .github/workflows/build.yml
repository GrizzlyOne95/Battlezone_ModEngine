name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: |
          python -m unittest discover -s tests

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libtk8.6 tk8.6-dev

      - name: Generate canonical app icon
        run: |
          python scripts/generate_app_icon.py branding/repo_icon.svg branding/app_icon.ico --png branding/app_icon.png

      - name: Generate Windows version metadata
        if: runner.os == 'Windows'
        run: |
          python scripts/generate_version_info.py --version "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0' }}" --output branding/version_info.txt

      - name: Build executable bundle
        run: |
          pyinstaller build.spec

      - name: Package release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "Battlezone_ModEngine-${env:GITHUB_REF_NAME}-windows.zip"
          Compress-Archive -Path dist/BZModEngine -DestinationPath $archive -Force
          Get-Item $archive

      - name: Package release (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "Battlezone_ModEngine-${GITHUB_REF_NAME}-linux.tar.gz" -C dist BZModEngine
          ls -lh "Battlezone_ModEngine-${GITHUB_REF_NAME}-linux.tar.gz"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            Battlezone_ModEngine-*.zip
            Battlezone_ModEngine-*.tar.gz

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Battlezone_ModEngine-windows
          path: Battlezone_ModEngine-*-windows.zip
          if-no-files-found: error

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Battlezone_ModEngine-linux
          path: Battlezone_ModEngine-*-linux.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Battlezone_ModEngine-windows/Battlezone_ModEngine-v*-windows.zip
            artifacts/Battlezone_ModEngine-linux/Battlezone_ModEngine-v*-linux.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
