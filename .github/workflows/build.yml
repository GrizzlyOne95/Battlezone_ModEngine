name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements-build.txt

      - name: Run tests
        run: |
          python -m unittest discover -s tests

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libtk8.6 tk8.6-dev

      - name: Generate canonical app icon
        run: |
          python scripts/generate_app_icon.py branding/repo_icon.svg branding/app_icon.ico --png branding/app_icon.png

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
          else
            version="$(tr -d '[:space:]' < VERSION)"
            tag="v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Generate Windows version metadata
        if: runner.os == 'Windows'
        run: |
          python scripts/generate_version_info.py --version "${{ steps.version.outputs.version }}" --output branding/version_info.txt

      - name: Build standalone executable
        run: |
          pyinstaller build.spec

      - name: Verify standalone executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path ".\dist\BZModEngine.exe" -PathType Leaf)) {
            throw "Expected standalone dist\BZModEngine.exe was not produced"
          }
          if (Test-Path ".\dist\BZModEngine" -PathType Container) {
            throw "Unexpected onedir bundle dist\BZModEngine was produced"
          }
          Get-Item ".\dist\BZModEngine.exe"

      - name: Verify standalone executable (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/BZModEngine
          test ! -d dist/BZModEngine
          chmod +x dist/BZModEngine
          ls -lh dist/BZModEngine

      - name: Verify standalone executable (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/BZModEngine
          test ! -d dist/BZModEngine
          chmod +x dist/BZModEngine
          ls -lh dist/BZModEngine

      - name: Package release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "Battlezone_ModEngine-${{ steps.version.outputs.tag }}-windows.zip"
          Compress-Archive -Path dist/BZModEngine.exe -DestinationPath $archive -Force
          Get-Item $archive

      - name: Package release (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "Battlezone_ModEngine-${{ steps.version.outputs.tag }}-linux.tar.gz" -C dist BZModEngine
          ls -lh "Battlezone_ModEngine-${{ steps.version.outputs.tag }}-linux.tar.gz"

      - name: Package release (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "Battlezone_ModEngine-${{ steps.version.outputs.tag }}-macos.tar.gz" -C dist BZModEngine
          ls -lh "Battlezone_ModEngine-${{ steps.version.outputs.tag }}-macos.tar.gz"

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            Battlezone_ModEngine-*.zip
            Battlezone_ModEngine-*.tar.gz

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Battlezone_ModEngine-windows
          path: Battlezone_ModEngine-*-windows.zip
          if-no-files-found: error

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Battlezone_ModEngine-linux
          path: Battlezone_ModEngine-*-linux.tar.gz
          if-no-files-found: error

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Battlezone_ModEngine-macos
          path: Battlezone_ModEngine-*-macos.tar.gz
          if-no-files-found: error

  # Decide whether this run publishes a release:
  # - a pushed v* tag always releases that tag;
  # - on main (push or manual run), VERSION releases when v<VERSION> is not
  #   tagged yet, so bumping VERSION releases regardless of how the change
  #   was merged, and later pushes never re-release an existing version.
  check-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.check.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check whether VERSION is unreleased
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/check_release.sh

  release:
    needs: [build, check-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: needs.check-release.outputs.should_release == 'true'
    # Never publish two releases at once (e.g. quick successive pushes to main).
    concurrency:
      group: release
      cancel-in-progress: false

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.check-release.outputs.tag }}
          name: ${{ needs.check-release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/Battlezone_ModEngine-windows/Battlezone_ModEngine-v*-windows.zip
            artifacts/Battlezone_ModEngine-linux/Battlezone_ModEngine-v*-linux.tar.gz
            artifacts/Battlezone_ModEngine-macos/Battlezone_ModEngine-v*-macos.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
